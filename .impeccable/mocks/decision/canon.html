<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Porotos · Estándar</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--label:#000;--sec:#6C6C70;--tint:#007AFF;--sep:#C6C6C8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--label);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
.status{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 8px;font-weight:600;font-size:16px}
.nav{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.nav a{color:var(--tint);font-size:17px;text-decoration:none}
h1{font-size:34px;font-weight:700;padding:2px 16px 12px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.t{background:var(--card);border-radius:14px;padding:16px;text-align:center}
.t .n{font-size:17px;font-weight:600}
.t .s{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui;font-size:72px;font-weight:700;line-height:1.1;margin:6px 0}
.t .h{font-size:13px;color:var(--sec)}
.row{display:flex;gap:8px;margin-top:14px}
.b{flex:1;height:48px;border-radius:12px;background:rgba(0,122,255,.12);color:var(--tint);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.b.p{background:var(--tint);color:#fff}
.sec{font-size:13px;color:var(--sec);text-transform:uppercase;padding:28px 32px 8px}
.list{margin:0 16px;background:var(--card);border-radius:12px}
.li{display:flex;justify-content:space-between;padding:12px 16px;font-size:17px;border-bottom:.5px solid var(--sep)}
.li:last-child{border:0}.li span{color:var(--sec)}
.end{position:absolute;top:770px;left:16px;right:16px;height:50px;border-radius:12px;background:var(--card);color:#FF3B30;display:flex;align-items:center;justify-content:center;font-size:17px}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;background:#000;border-radius:3px}
</style></head><body>
<div class="status"><span>21:47</span><span>●●● 82%</span></div>
<nav class="nav"><a href="#">‹ Partidas</a><a href="#">Deshacer</a></nav>
<h1>Truco a 30</h1>
<section class="teams">
  <div class="t"><div class="n">Nosotros</div><div class="s">18</div><div class="h">3 en las buenas</div><div class="row"><div class="b">−</div><div class="b p">+1</div></div></div>
  <div class="t"><div class="n">Ellos</div><div class="s">11</div><div class="h">11 en las malas</div><div class="row"><div class="b">−</div><div class="b p">+1</div></div></div>
</section>
<div class="sec">Últimos tantos</div>
<div class="list">
  <div class="li">Nosotros +3 <span>21:46</span></div>
  <div class="li">Ellos +2 <span>21:44</span></div>
  <div class="li">Nosotros +1 <span>21:43</span></div>
  <div class="li">Nosotros +2 <span>21:41</span></div>
</div>
<div class="end">Terminar partida</div>
<div class="home"></div>
</body></html>
