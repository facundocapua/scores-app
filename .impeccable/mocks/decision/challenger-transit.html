<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Porotos · Subte</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ground:#0F1D3A;--porcelain:#F3F3EE;--dim:#8E9AB3;--a:#19A3DE;--b:#E4243B;--amber:#F5A800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--porcelain);font-family:Overpass,-apple-system,system-ui,sans-serif}
.status{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 8px;font-weight:600;font-size:16px;font-family:-apple-system,system-ui}
.nav{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;font-family:-apple-system,system-ui}
.nav a{color:var(--amber);font-size:17px;text-decoration:none}.nav a:last-child{justify-self:end}
.nav b{font-size:17px;font-weight:600}
.heads{display:grid;grid-template-columns:1fr 1fr;padding:16px 28px 0}
.head{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff}
.head .n{font-weight:800;font-size:24px;line-height:1}
.head .s{font-weight:800;font-size:40px;line-height:1}
.map{position:relative;height:520px;margin-top:12px}
.map svg{position:absolute;inset:0}
.lab{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.actions{position:absolute;top:676px;left:16px;right:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{height:60px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff}
.end{position:absolute;top:780px;left:0;right:0;text-align:center;color:var(--dim);font-size:15px;font-family:-apple-system,system-ui}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;background:#fff;border-radius:3px}
</style></head><body>
<div class="status"><span>21:47</span><span>●●● 82%</span></div>
<nav class="nav"><a href="#">‹ Partidas</a><b>Truco a 30</b><a href="#">Deshacer</a></nav>
<div class="heads">
  <div class="head"><div class="logo" style="background:var(--a)">N</div><div><div class="n">Nosotros</div></div><div class="s" style="margin-left:auto">18</div></div>
  <div class="head" style="margin-left:24px"><div class="logo" style="background:var(--b)">E</div><div class="n">Ellos</div><div class="s" style="margin-left:auto">11</div></div>
</div>
<div class="map">
<svg viewBox="0 0 390 520" width="390" height="520">
  <!-- line A (Nosotros): 0 at top, 30 at bottom; 1 tanto = 16px from y=20 -->
  <line x1="110" y1="20" x2="110" y2="500" stroke="#19A3DE" stroke-width="10" stroke-opacity=".3" stroke-linecap="round"/>
  <line x1="110" y1="20" x2="110" y2="308" stroke="#19A3DE" stroke-width="10" stroke-linecap="round"/>
  <line x1="280" y1="20" x2="280" y2="500" stroke="#E4243B" stroke-width="10" stroke-opacity=".3" stroke-linecap="round"/>
  <line x1="280" y1="20" x2="280" y2="196" stroke="#E4243B" stroke-width="10" stroke-linecap="round"/>
  <!-- station ticks every 5 -->
  <g stroke="#F3F3EE" stroke-width="3">
    <line x1="96" y1="100" x2="110" y2="100"/><line x1="96" y1="180" x2="110" y2="180"/><line x1="96" y1="340" x2="110" y2="340"/><line x1="96" y1="420" x2="110" y2="420"/>
    <line x1="280" y1="100" x2="294" y2="100"/><line x1="280" y1="180" x2="294" y2="180"/><line x1="280" y1="340" x2="294" y2="340"/><line x1="280" y1="420" x2="294" y2="420"/>
  </g>
  <!-- interchange at 15: buenas -->
  <rect x="96" y="248" width="198" height="24" rx="12" fill="#0F1D3A" stroke="#F3F3EE" stroke-width="4"/>
  <!-- terminal 30 -->
  <circle cx="110" cy="500" r="11" fill="#0F1D3A" stroke="#F3F3EE" stroke-width="4"/>
  <circle cx="280" cy="500" r="11" fill="#0F1D3A" stroke="#F3F3EE" stroke-width="4"/>
  <!-- current positions -->
  <circle cx="110" cy="308" r="15" fill="#F3F3EE" stroke="#19A3DE" stroke-width="6"/>
  <circle cx="280" cy="196" r="13" fill="#F3F3EE" stroke="#E4243B" stroke-width="5"/>
  <g fill="#8E9AB3" font-family="Overpass" font-weight="600" font-size="13">
    <text x="64" y="104">5</text><text x="58" y="184">10</text><text x="58" y="344">20</text><text x="58" y="424">25</text><text x="58" y="504">30</text>
    <text x="306" y="104">5</text><text x="306" y="184">10</text><text x="306" y="344">20</text><text x="306" y="424">25</text><text x="306" y="504">30</text>
  </g>
</svg>
<div class="lab" style="top:252px">Buenas · 15</div>
</div>
<div class="actions"><div class="btn" style="background:var(--a)">+1</div><div class="btn" style="background:var(--b)">+1</div></div>
<div class="end">Terminar partida</div>
<div class="home"></div>
</body></html>
